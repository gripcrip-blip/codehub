name: Update promo codes

on:
  schedule:
    # 06:00 UTC = 09:00 Moscow
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "parser/**"
      - ".github/workflows/update-codes.yml"

permissions:
  contents: write

jobs:
  update-codes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect codes
        run: python parser/update_codes.py

      - name: Commit data/codes.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codes.json
          if git diff --cached --quiet; then
            echo "No code changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update promo codes from public sources"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.commit.outputs.changed == 'true'
        run: npm ci

      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true'
        run: npx netlify-cli deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
