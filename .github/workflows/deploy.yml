name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "parser/**"
      - "data/codes.json"
      - ".github/workflows/update-codes.yml"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Netlify
        id: netlify
        continue-on-error: true
        run: npx netlify-cli@27.4.1 deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Note paused production deploys
        if: steps.netlify.outcome == 'failure'
        run: echo "::warning::Netlify production deploys are paused (operational credits). The GitHub copy is up to date; the live site will update after the next billing cycle or an upgrade."
